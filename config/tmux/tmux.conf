# Prefix: Ctrl+Space; F12 is a second prefix.
unbind C-b
set -g prefix C-Space
set -g prefix2 F12
bind C-Space send-prefix

# Terminal
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -g focus-events on
set -g mouse on

# Windows and sessions
set -g base-index 1
set -wg pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g status-interval 60 # clock shows minutes; also paces continuum's save check
set -g detach-on-destroy off
set -g exit-empty off

# Keys
bind T switch-client -t todo
bind D switch-client -t dognosis
bind L switch-client -l
bind R send-keys Escape Escape ':confirm qa' Enter # restart nvim in this pane for new config

# Plugins (nixpkgs, see modules/home/tmux.nix). continuum saves every 15 min and
# restores at server start; saves live in one XDG folder, not ~/.tmux.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"~nvim->nvim ."' # nix's nvim is saved by store path; relaunch it
set -g @resurrect-hook-post-save-all '~/.config/tmux/scripts/resurrect-fill.sh'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
source-file -q ~/.local/share/tmux/plugins.conf

# Config changes apply on the next attach; each load records itself.
set-hook -g client-attached 'run-shell -b ~/.config/tmux/scripts/reload-if-changed.sh'
run-shell -b 'mkdir -p ~/.cache && readlink -f ~/.local/share/tmux/plugins.conf > ~/.cache/tmux-config-loaded'
